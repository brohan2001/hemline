name: Job feed

# Scrapes the public ATS job-board APIs listed in data/companies.json and
# publishes jobs.json (plus the landing and privacy pages in site/) to GitHub
# Pages for the extension dashboard. Uses no secrets.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'jobstream.js'
      - 'pipeline/jobfilter.js'
      - 'scripts/build-feed.mjs'
      - '.github/workflows/feed.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-feed.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
